<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>千问百炼 AI 聊天</title>
    <!-- 使用 Element Plus 样式 -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: #f5f7fa;
        height: 100vh;
        overflow: hidden;
      }
      #app {
        height: 100vh;
      }
      /* 滚动条美化 */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f0f0f0;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb {
        background: #c1c1c1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a8a8;
      }
      /* 消息中的代码块样式 */
      .message-content pre {
        background: #1e1e2e;
        color: #cdd6f4;
        padding: 12px 16px;
        border-radius: 8px;
        overflow-x: auto;
        margin: 8px 0;
        font-size: 13px;
        line-height: 1.6;
      }
      .message-content code {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        background: rgba(0, 0, 0, 0.06);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.9em;
      }
      .message-content pre code {
        background: transparent;
        padding: 0;
        border-radius: 0;
        font-size: inherit;
      }
      /* 打字光标动画 */
      .typing-cursor::after {
        content: '▊';
        animation: blink 1s step-end infinite;
        color: #409eff;
        margin-left: 2px;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }
      /* 附件预览 */
      .file-preview-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #f0f2f5;
        padding: 4px 12px 4px 8px;
        border-radius: 16px;
        font-size: 13px;
        margin: 2px 4px 2px 0;
      }
      .file-preview-item .el-icon {
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- 使用 importmap 加载 Vue 和相关库 -->
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
          "element-plus": "https://unpkg.com/element-plus",
          "element-plus/dist/index.css": "https://unpkg.com/element-plus/dist/index.css",
          "axios": "https://unpkg.com/axios/dist/axios.min.js",
          "dayjs": "https://unpkg.com/dayjs/dayjs.min.js"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
